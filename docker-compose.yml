services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger}@ledger:5432/${POSTGRES_DB:-ledger}
      - FLOWSCOUT_LEDGER=postgres
      - FLOWSCOUT_CONSOLE_STORE=${FLOWSCOUT_CONSOLE_STORE:-postgres}
      - API_PORT=8080
      - CELESTO_MODE=${CELESTO_MODE:-mock}
      - CELESTO_API_KEY=${CELESTO_API_KEY:-}
      - CELESTO_PROVIDER=${CELESTO_PROVIDER:-cloud}
      - CELESTO_SIZE_ID=${CELESTO_SIZE_ID:-micro}
      - CELESTO_IMAGE=${CELESTO_IMAGE:-ubuntu-desktop-24.04}
      - CELESTO_TEMPLATE_ID=${CELESTO_TEMPLATE_ID:-browser-agent}
      - CELESTO_CREATE_PATIENCE_S=${CELESTO_CREATE_PATIENCE_S:-1800}
      - CELESTO_KEEP_COMPUTER_IDS=${CELESTO_KEEP_COMPUTER_IDS:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - console_data:/app/reports/console
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ledger:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ledger}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ledger}
      - POSTGRES_DB=${POSTGRES_DB:-ledger}
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ledger_data:
  console_data:
